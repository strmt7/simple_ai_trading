    { name = "torch" },
]
microstructure = [
    { name = "hftbacktest" },
]
polymarket-live = [
    { name = "polymarket-client" },
    { name = "py-clob-client-v2" },
]
reporting = [
    { name = "matplotlib" },
]
terminal-test = [
    { name = "pexpect", marker = "sys_platform != 'win32' or (extra == 'extra-17-simple-ai-trading-directml' and extra == 'extra-17-simple-ai-trading-gpu')" },
    { name = "pyte" },
    { name = "pywinpty", marker = "sys_platform == 'win32' or (extra == 'extra-17-simple-ai-trading-directml' and extra == 'extra-17-simple-ai-trading-gpu')" },
]

[package.dev-dependencies]
