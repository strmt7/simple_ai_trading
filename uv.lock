directml = [
    { name = "onnxruntime-directml", marker = "sys_platform == 'win32'" },
]
foundation-ai = [
    { name = "einops" },
    { name = "huggingface-hub" },
    { name = "pandas", version = "2.3.3", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.14' or (extra == 'extra-17-simple-ai-trading-directml' and extra == 'extra-17-simple-ai-trading-gpu')" },
