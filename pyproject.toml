[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ai-trading"
version = "0.1.0b1"
description = "Autonomous BTC/ETH/SOL day-trading CLI and Windows app with conservative testnet-first safeguards"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Remove the compromised emSign G3 root while retaining unaffected roots.
    "certifi>=2026.10.19",
    "defusedxml>=0.7.1,<1",
    "duckdb==2.0.0",
    "lightgbm==4.7.0",
    "numba==0.68.1",
    # Latest compatible with the supported HftBacktest release's <2.3 bound.
    "numpy==2.2.6",
    "requests>=2.32.0,<3",
    "scipy==1.17.1; python_version < '3.12'",
    "scipy==1.18.1; python_version >= '3.12'",
    "textual==8.2.8",
    "urllib3>=2.8.0,<3",
    # polymarket-client currently requires websockets <16.
    "websockets==15.0.1",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
gpu = [
    "safetensors==0.8.0",
    "torch==2.15.0",
    "filelock>=4.2.10",
    "setuptools>=84.2.1",
]
directml = [
    "onnxruntime-directml==1.24.4; platform_system == 'Windows'",
]
terminal-test = [
    "pyte>=0.8.2,<1",
    "pywinpty>=3.0.3,<4; platform_system == 'Windows'",
    "pexpect>=4.9.0,<5; platform_system != 'Windows'",
]
microstructure = [
    "hftbacktest==2.4.4",
    # Bokeh's image dependency must also be patched for non-uv installs.
    "pillow>=13.0.0,<14",
    # Include the current server fixes for non-uv installs as well.
    "tornado==6.6.1",
]
reporting = [
    "matplotlib==3.11.2",
    "pillow>=13.0.0,<14",
]
polymarket-live = [
    "polymarket-client==0.18.0",
    "py-clob-client-v2==1.2.1",
    "msgpack>=1.2.3,<2",
]
foundation-ai = [
    "einops==0.8.2",
    "huggingface_hub==2.4.0",
    "filelock>=4.2.10",
    "pandas>=2.2,<4",
    "safetensors==0.8.0",
    "tqdm>=4.67,<5",
]

[dependency-groups]
test = [
    "coverage==7.17.2",
    "diff-cover==11.0.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
release = [
    "build==1.6.1",
]
tools = [
    "uv==0.13.7",
    "cmake==4.4.4",
    "ninja==1.13.2",
]

[tool.uv]
required-version = ">=0.12.1,<0.14"
conflicts = [
    [
        { extra = "gpu" },
        { extra = "directml" },
    ],
]

[project.scripts]
simple-ai-trading = "simple_ai_trading.entrypoint:main"
simple-ai-trading-windows = "simple_ai_trading.windows_app:main"

[tool.simple-ai-trading.installer]
# Highest minor with wheels for the entire supported numerical stack.
python = "3.13"

[tool.pytest.ini_options]
addopts = ["-q"]

[tool.ruff]
# Retained third-party evidence is data, never an authored formatting target.
extend-exclude = ["docs/model-research/**/raw/**", "data/**/raw/**"]
force-exclude = true

[tool.ruff.lint]
# Preserve the pre-0.16 rule contract; expand rules in reviewed changes, not
# implicitly through a dependency bump against immutable historical code.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Consumed NFL period-margin contract/result bind this exact implementation.
"tools/adjudicate_polymarket_nfl_catalog_period_margin.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["src/simple_ai_trading"]
omit = ["src/simple_ai_trading/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 2
# The 2026-07-16 Windows baseline is 75.95% across 75,696 measured statements
# and branches. Keep a small cross-platform margin for GPU-specific test skips;
# CI separately requires 95% coverage on changed executable lines.
fail_under = 75.0
